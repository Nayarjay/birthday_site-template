<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Notre aventure — 25 ans</title>
<meta name="description" content="Un voyage de Minecraft à Homies Company, en 5 chapitres." />

<!-- GSAP (animations) — CDN officiel cdnjs, sécurisé par hash SRI + crossorigin.
     Le navigateur REFUSE le fichier s'il ne correspond pas au hash => import vérifié.
     Chargé en "defer" (non bloquant). Si le CDN est indisponible, le site reste
     100% fonctionnel : les transitions et bulles sont assurées en CSS natif. -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
  integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg=="
  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"
  integrity="sha512-onMTRKJBKz8M1TnqqDuGBlowlH0ohFzMXYRNebz+yOcc5TQr/zAKsthzhuv0hiyUKEiQEQXEynnXCvNTOk50dg=="
  crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<!--
=====================================================================
  SITE ANNIVERSAIRE — 25 ANS  ·  storytelling en slides horizontaux
  -------------------------------------------------------------------
  · 5 chapitres qui défilent de gauche à droite.
  · Bulles de texte façon BD / chat, avec apparition animée.
  · Une identité graphique par chapitre + fond qui évolue en douceur.
  · 100 % autonome : AUCUNE bibliothèque, AUCUN import réseau.
    => rien à charger = aucun risque de sécurité, fonctionne hors-ligne.

  ✏️  POUR TOUT MODIFIER (textes, bulles, images, couleurs) :
      va dans le <script> plus bas, bloc "===== CONTENU A EDITER =====".
      Tout y est regroupé. Tu changes juste ce qui est entre guillemets.

  🖼️  POUR AJOUTER TES IMAGES :
      dans chaque chapitre, renseigne le champ  image:"chemin/vers/photo.jpg"
      (mets tes photos dans un dossier "images" à côté de ce fichier).
      Tant que le champ est vide (""), une zone repère s'affiche à la place.

  🎵  POUR AJOUTER LA MUSIQUE (une par chapitre) :
      dans chaque chapitre, renseigne le champ  music:"audio/xxx.mp3"
      (mets tes fichiers .mp3 dans un dossier "audio" à côté de ce fichier).
      La musique change toute seule quand on passe d'un chapitre à l'autre,
      avec un fondu doux. Une petite barre de son (en haut à droite) permet
      d'activer/couper le son et de régler le volume.
      Le son est COUPÉ au départ : il faut cliquer sur le bouton haut-parleur
      (les navigateurs interdisent de lancer un son sans un clic de l'utilisateur).
      Champ vide "" = pas de musique pour ce chapitre (silence).
=====================================================================
-->

<style>
:root{
  --bg:#0a0b10;
  --ink:#f4f6fb;
  --muted:rgba(244,246,251,.62);
  --ring:rgba(255,255,255,.14);
  --ease:cubic-bezier(.22,.61,.36,1);
  /* couleurs du thème courant (mises à jour au fil des slides) */
  --a:#7c5cff;
  --b:#00d4ff;
}
/* Permet au fond ambiant de FONDRE d'une couleur de thème à l'autre.
   Si le navigateur ne connaît pas @property, la couleur change quand même
   (juste sans le fondu) — aucun bug. */
@property --a{syntax:'<color>';inherits:true;initial-value:#7c5cff}
@property --b{syntax:'<color>';inherits:true;initial-value:#00d4ff}
:root{transition:--a 1.1s var(--ease),--b 1.1s var(--ease)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}

/* ---- Fond ambiant global qui évolue en douceur entre les thèmes ---- */
#bgwash{
  position:fixed;inset:0;z-index:-3;
  background:
    radial-gradient(120% 90% at 12% 8%, color-mix(in srgb,var(--a) 40%,transparent), transparent 58%),
    radial-gradient(120% 90% at 88% 100%, color-mix(in srgb,var(--b) 36%,transparent), transparent 58%),
    var(--bg);
  transition:--a 1.1s var(--ease), --b 1.1s var(--ease), background 1.1s var(--ease);
}
/* grille discrète par-dessus le fond */
#bggrid{
  position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:54px 54px;
  mask-image:radial-gradient(130% 120% at 50% 40%,#000 32%,transparent 80%);
}

/* ---------------- Piste horizontale ---------------- */
#track{
  height:100vh;height:100dvh;display:flex;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;
}
#track::-webkit-scrollbar{display:none}

.slide{
  position:relative;flex:0 0 100%;width:100vw;height:100%;
  scroll-snap-align:center;scroll-snap-stop:always;
  display:grid;place-items:center;
  padding:clamp(20px,4.5vw,80px);
}
/* halo local, teinté par le thème du chapitre */
.slide::before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:radial-gradient(70% 60% at var(--hx,30%) var(--hy,20%),
             color-mix(in srgb,var(--sa) 30%,transparent),transparent 62%);
  opacity:0;transition:opacity 1s var(--ease);
}
.slide.active::before{opacity:1}

/* ---------------- Mise en page d'un chapitre ---------------- */
.inner{
  width:min(1120px,100%);
  display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(24px,4vw,64px);
  align-items:center;
}
.slide.flip .inner{direction:rtl}
.slide.flip .inner>*{direction:ltr}

/* ---- Colonne visuel / image ---- */
.visual{position:relative}
.frame{
  position:relative;width:100%;aspect-ratio:4/5;border-radius:22px;overflow:hidden;
  border:1px solid var(--ring);
  background:
    linear-gradient(160deg,color-mix(in srgb,var(--sa) 26%,transparent),color-mix(in srgb,var(--sb) 20%,transparent)),
    #0e1017;
  box-shadow:0 30px 80px -30px rgba(0,0,0,.75),
             inset 0 1px 0 rgba(255,255,255,.06);
  transform:translateY(30px) scale(.97);opacity:0;
  transition:transform .9s var(--ease),opacity .9s var(--ease);
}
.slide.active .frame{transform:none;opacity:1}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
/* zone repère quand aucune image n'est fournie */
.frame .placeholder{
  position:absolute;inset:0;display:grid;place-content:center;gap:.6em;text-align:center;
  color:var(--muted);padding:24px;
}
.frame .placeholder .pemoji{font-size:clamp(2.6rem,7vw,4rem);
  filter:drop-shadow(0 8px 22px rgba(0,0,0,.5))}
.frame .placeholder .pnote{font-size:.82rem;letter-spacing:.02em;line-height:1.5;max-width:24ch;margin:0 auto}
.frame .placeholder code{color:color-mix(in srgb,var(--sb) 75%,var(--ink));
  background:rgba(255,255,255,.06);padding:.1em .45em;border-radius:6px;font-size:.85em}
.frame .placeholder .dash{position:absolute;inset:12px;border:2px dashed var(--ring);border-radius:16px;pointer-events:none}
/* légende sous l'image */
.caption{
  margin-top:14px;font-size:.82rem;letter-spacing:.04em;color:var(--muted);text-align:center;
  opacity:0;transform:translateY(10px);transition:.7s var(--ease) .25s;
}
.slide.active .caption{opacity:1;transform:none}

/* ---- Colonne récit ---- */
.story{max-width:560px}
.chapter{
  display:inline-flex;align-items:center;gap:.55em;
  font-size:clamp(.66rem,1.5vw,.78rem);letter-spacing:.26em;text-transform:uppercase;
  color:var(--muted);padding:.5em 1em;border:1px solid var(--ring);border-radius:999px;
  background:rgba(255,255,255,.03);
  opacity:0;transform:translateY(18px);transition:.6s var(--ease);
}
.chapter .dot{width:.5em;height:.5em;border-radius:50%;
  background:linear-gradient(90deg,var(--sa),var(--sb));box-shadow:0 0 12px var(--sa)}
.tag{
  display:block;font-weight:800;letter-spacing:.02em;margin:.7em 0 .1em;
  font-size:clamp(.9rem,2vw,1.05rem);
  color:color-mix(in srgb,var(--sb) 82%,var(--ink));
  opacity:0;transform:translateY(18px);transition:.6s var(--ease) .06s;
}
h2{
  font-size:clamp(1.9rem,4.6vw,3.3rem);font-weight:800;letter-spacing:-.02em;line-height:1.04;
  margin-bottom:.5em;
  background:linear-gradient(120deg,var(--ink),color-mix(in srgb,var(--sb) 65%,var(--ink)));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;transform:translateY(18px);transition:.7s var(--ease) .12s;
}
.slide.active .chapter,
.slide.active .tag,
.slide.active h2{opacity:1;transform:none}

/* ---- Bulles style BD / chat ---- */
.chat{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.bubble{
  position:relative;max-width:82%;padding:.85em 1.1em;border-radius:18px;
  font-size:clamp(.92rem,2vw,1.05rem);line-height:1.5;font-weight:500;
  border:1px solid var(--ring);
  box-shadow:0 12px 30px -14px rgba(0,0,0,.7);
  opacity:0;transform:scale(.8) translateY(14px);
  transition:opacity .5s var(--ease),transform .5s cubic-bezier(.34,1.56,.64,1);
}
.slide.active .bubble{opacity:1;transform:none}
/* apparition en cascade des bulles */
.slide.active .bubble:nth-child(1){transition-delay:.30s}
.slide.active .bubble:nth-child(2){transition-delay:.48s}
.slide.active .bubble:nth-child(3){transition-delay:.66s}
.slide.active .bubble:nth-child(4){transition-delay:.84s}
/* interlocuteur A -> à gauche */
.bubble.a{align-self:flex-start;border-bottom-left-radius:5px;
  background:color-mix(in srgb,var(--sa) 22%,#12141c);}
.bubble.a::after{content:"";position:absolute;left:-7px;bottom:8px;
  width:14px;height:14px;background:inherit;border-left:1px solid var(--ring);
  border-bottom:1px solid var(--ring);transform:rotate(45deg);border-radius:0 0 0 4px}
/* interlocuteur B -> à droite */
.bubble.b{align-self:flex-end;text-align:left;border-bottom-right-radius:5px;
  background:color-mix(in srgb,var(--sb) 20%,#12141c);}
.bubble.b::after{content:"";position:absolute;right:-7px;bottom:8px;
  width:14px;height:14px;background:inherit;border-right:1px solid var(--ring);
  border-bottom:1px solid var(--ring);transform:rotate(-45deg);border-radius:0 0 4px 0}
.bubble .who{display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;
  opacity:.6;margin-bottom:.25em;font-weight:700}

/* ---------------- Habillage / navigation ---------------- */
#progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:50;
  background:linear-gradient(90deg,var(--sa,var(--a)),var(--sb,var(--b)));transition:width .4s var(--ease)}
#dots{position:fixed;left:50%;bottom:clamp(14px,3.5vh,30px);transform:translateX(-50%);
  display:flex;gap:11px;z-index:50;padding:9px 13px;border-radius:999px;
  background:rgba(0,0,0,.4);border:1px solid var(--ring);backdrop-filter:blur(10px)}
#dots button{width:9px;height:9px;border-radius:50%;border:0;cursor:pointer;padding:0;
  background:rgba(255,255,255,.28);transition:.3s var(--ease)}
#dots button:hover{background:rgba(255,255,255,.55)}
#dots button.on{width:26px;border-radius:999px;background:linear-gradient(90deg,var(--a),var(--b))}
.nav{position:fixed;top:50%;transform:translateY(-50%);z-index:50;width:50px;height:50px;
  border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--ink);
  background:rgba(0,0,0,.4);border:1px solid var(--ring);backdrop-filter:blur(10px);
  transition:transform .25s var(--ease),background .25s var(--ease),opacity .3s}
.nav:hover{background:rgba(255,255,255,.12);transform:translateY(-50%) scale(1.08)}
.nav:disabled{opacity:.22;cursor:default;transform:translateY(-50%)}
#prev{left:clamp(10px,2vw,24px)}#next{right:clamp(10px,2vw,24px)}
.nav svg{width:21px;height:21px}
.hint{position:fixed;bottom:clamp(58px,11vh,96px);left:50%;transform:translateX(-50%);z-index:40;
  display:flex;align-items:center;gap:.55em;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);animation:nudge 2.2s var(--ease) infinite;transition:opacity .5s}
@keyframes nudge{0%,100%{transform:translateX(-50%)}50%{transform:translateX(calc(-50% + 9px))}}

/* ---------------- Barre de son ---------------- */
#sound{
  position:fixed;top:clamp(10px,2vw,20px);right:clamp(10px,2vw,24px);z-index:60;
  display:flex;align-items:center;gap:10px;
  padding:7px 13px 7px 9px;border-radius:999px;
  background:rgba(0,0,0,.42);border:1px solid var(--ring);backdrop-filter:blur(10px);
  color:var(--ink);
}
#soundBtn{
  width:32px;height:32px;flex:0 0 auto;border:0;border-radius:50%;cursor:pointer;padding:0;
  display:grid;place-items:center;color:var(--ink);
  background:rgba(255,255,255,.08);transition:.25s var(--ease);
}
#soundBtn:hover{background:rgba(255,255,255,.18);transform:scale(1.06)}
#soundBtn svg{width:18px;height:18px}
/* état MUET : on masque les ondes et on montre la croix */
#soundBtn .waves{display:none}
#soundBtn .cross{display:block}
#soundBtn.on .waves{display:block}
#soundBtn.on .cross{display:none}
#soundBtn.on{background:linear-gradient(120deg,
  color-mix(in srgb,var(--a) 55%,#12141c),
  color-mix(in srgb,var(--b) 55%,#12141c))}
.slabel{
  font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);max-width:15ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#vol{
  width:82px;height:4px;cursor:pointer;
  accent-color:color-mix(in srgb,var(--b) 80%,var(--ink));
}

/* ---------------- Responsive ---------------- */
@media (max-width:860px){
  #sound{gap:8px;padding:6px 10px 6px 7px}
  #vol{width:64px}
  .slabel{display:none}
  .inner{grid-template-columns:1fr;gap:22px;max-width:520px}
  .slide.flip .inner{direction:ltr}
  .frame{aspect-ratio:16/10}
  .story{max-width:none}
  .nav{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;scroll-behavior:auto!important;transition:none!important}
  .chapter,.tag,h2,.frame,.caption,.bubble{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div id="bgwash"></div>
<div id="bggrid"></div>

<div id="progress"></div>
<main id="track" aria-label="Notre histoire en chapitres"></main>

<button id="prev" class="nav" aria-label="Chapitre précédent">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
</button>
<button id="next" class="nav" aria-label="Chapitre suivant">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
</button>
<div class="hint" id="hint">Fais défiler
  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
</div>
<nav id="dots" aria-label="Aller à un chapitre"></nav>

<!-- Barre de son : activer/couper + volume. Discrète, en haut à droite. -->
<div id="sound" role="group" aria-label="Contrôle du son">
  <button id="soundBtn" type="button" aria-pressed="false" aria-label="Activer le son">
    <!-- icône haut-parleur (muet par défaut) -->
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5 6 9H2v6h4l5 4V5z"/>
      <g class="waves"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></g>
      <g class="cross"><path d="M22 9l-6 6"/><path d="M16 9l6 6"/></g>
    </svg>
  </button>
  <span id="soundLabel" class="slabel">Son coupé</span>
  <input id="vol" type="range" min="0" max="1" step="0.01" value="0.55" aria-label="Volume">
</div>

<script>
/* =====================================================================
   ===== CONTENU A EDITER ============================================
   Les deux prénoms qui "discutent" dans les bulles :
   ===================================================================== */
const NAME_A = "Moi";   // parle dans les bulles de GAUCHE
const NAME_B = "Toi";   // parle dans les bulles de DROITE

/* Chaque objet = 1 chapitre (dans l'ordre d'affichage).
   - chapter  : petit label du haut
   - tag      : nom de l'univers (sous-titre coloré)
   - title    : le grand titre
   - image    : chemin d'une photo ("images/photo.jpg"). Vide "" = zone repère.
   - caption  : légende sous l'image
   - a / b    : les 2 couleurs du thème (dégradés, bulles, halo)
   - bubbles  : la conversation. from:"a" (gauche) ou "b" (droite), text:"..."
*/
const STORY = [
  {
    chapter:"Chapitre 1 — Là où tout commence",
    tag:"Minecraft",
    title:"Poser les premiers blocs.",
    image:"",                                   /* 🖼️ IMAGE_SLIDE_1 */
    music:"audio/minecraft.mp3",                /* 🎵 thème principal Minecraft */
    caption:"Notre toute première base",
    a:"#4caf50", b:"#8d6e63",
    bubbles:[
      {from:"a", text:"Tu te rappelles notre première nuit sur Minecraft ?"},
      {from:"b", text:"On avait même pas de torches, on flippait des zombies 😅"},
      {from:"a", text:"Notre base c’était juste un trou dans la montagne… et c’était parfait."}
    ]
  },
  {
    chapter:"Chapitre 2 — L’arène",
    tag:"League of Legends",
    title:"Duo bot, cœur solide.",
    image:"",                                   /* 🖼️ IMAGE_SLIDE_2 */
    music:"audio/league.mp3",                   /* 🎵 musique League of Legends */
    caption:"Blitzcrank & Draven — le duo",
    a:"#c8aa6e", b:"#0a97b0",
    bubbles:[
      {from:"a", text:"Bot lane : toi Draven, moi Blitzcrank ?"},
      {from:"b", text:"Grab + ult, on les efface 💀 Les haches font le reste."},
      {from:"a", text:"15 défaites d’affilée… mais qu’est-ce qu’on a ri."}
    ]
  },
  {
    chapter:"Chapitre 3 — Hors de l’écran",
    tag:"Salle de musculation",
    title:"On soulève, ensemble.",
    image:"",                                   /* 🖼️ IMAGE_SLIDE_3 */
    music:"audio/calme.mp3",                    /* 🎵 quelque chose de calme */
    caption:"La même team, dans la vraie vie",
    a:"#ff5722", b:"#263238",
    bubbles:[
      {from:"a", text:"Manette rangée, direction la salle 💪"},
      {from:"b", text:"T’as intérêt à me spot au développé couché."},
      {from:"a", text:"Séance après séance, on se lâchait rien."}
    ]
  },
  {
    chapter:"Chapitre 4 — Tactique",
    tag:"Valorant",
    title:"Poser le mur, lancer la mèche.",
    image:"",                                   /* 🖼️ IMAGE_SLIDE_4 */
    music:"audio/valorant.mp3",                 /* 🎵 musique Valorant (optionnel) */
    caption:"Sage & Raze — coordination totale",
    a:"#ff4655", b:"#18e0c8",
    bubbles:[
      {from:"a", text:"Mur de glace posé, tu peux y aller."},
      {from:"b", text:"Je rush Raze : satchel, boom, double kill 🎯"},
      {from:"a", text:"Nos clutchs à 1v3… des vrais frissons."}
    ]
  },
  {
    chapter:"Chapitre 5 — Le grand saut",
    tag:"Homies Company",
    title:"De joueurs à créateurs.",
    image:"",                                   /* 🖼️ IMAGE_SLIDE_5 */
    music:"audio/lofi.mp3",                     /* 🎵 lofi — Homies Company */
    caption:"« Un bon jeu commence par une bonne équipe »",
    a:"#a855f7", b:"#22d3ee",
    bubbles:[
      {from:"a", text:"Et si, cette fois, on créait nos propres jeux ?"},
      {from:"b", text:"Homies Company. Notre passion devenue projet."},
      {from:"a", text:"De joueurs à créateurs. On l’a fait — joyeux 25 ans 🎉"}
    ]
  }
];
/* =================== FIN DU CONTENU A EDITER ======================== */


/* ---------------------------------------------------------------------
   MOTEUR (pas besoin d'y toucher) — génère les slides et gère la nav.
   --------------------------------------------------------------------- */
const track=document.getElementById('track');
const dotsWrap=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const progress=document.getElementById('progress');
const hint=document.getElementById('hint');
const root=document.documentElement;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>(
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

STORY.forEach((s,i)=>{
  const slide=document.createElement('section');
  slide.className='slide'+(i%2?' flip':'');   // alterne le côté de l'image
  slide.style.setProperty('--sa', s.a||'#7c5cff');
  slide.style.setProperty('--sb', s.b||'#00d4ff');
  slide.style.setProperty('--hx', i%2?'75%':'25%');

  const visual = s.image
    ? `<img src="${esc(s.image)}" alt="${esc(s.tag)}" loading="lazy"
            onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
       <div class="placeholder" style="display:none"><span class="dash"></span>
         <span class="pemoji">🖼️</span>
         <span class="pnote">Image introuvable.<br>Vérifie le chemin dans <code>image:</code></span></div>`
    : `<div class="placeholder"><span class="dash"></span>
         <span class="pemoji">📷</span>
         <span class="pnote">Zone photo — chapitre ${i+1}.<br>Ajoute <code>image:"images/…"</code> dans le code.</span></div>`;

  const bubbles = s.bubbles.map(b=>{
    const side = b.from==='b' ? 'b' : 'a';
    const who  = side==='b' ? NAME_B : NAME_A;
    return `<div class="bubble ${side}"><span class="who">${esc(who)}</span>${esc(b.text)}</div>`;
  }).join('');

  slide.innerHTML=`
    <div class="inner">
      <div class="visual">
        <div class="frame">${visual}</div>
        <div class="caption">${esc(s.caption||'')}</div>
      </div>
      <div class="story">
        <span class="chapter"><span class="dot"></span>${esc(s.chapter)}</span>
        <span class="tag">${esc(s.tag)}</span>
        <h2>${esc(s.title)}</h2>
        <div class="chat">${bubbles}</div>
      </div>
    </div>`;
  track.appendChild(slide);

  const b=document.createElement('button');
  b.setAttribute('aria-label',`Chapitre ${i+1} : ${s.tag}`);
  b.addEventListener('click',()=>goTo(i));
  dotsWrap.appendChild(b);
});

const slides=[...document.querySelectorAll('.slide')];
const dots=[...dotsWrap.children];
let current=-1;

function goTo(i){
  i=Math.max(0,Math.min(slides.length-1,i));
  slides[i].scrollIntoView({behavior:'smooth',inline:'start'});
}
function setActive(i){
  if(i===current) return;
  current=i;
  slides.forEach((s,k)=>s.classList.toggle('active',k===i));
  dots.forEach((d,k)=>d.classList.toggle('on',k===i));
  // fait évoluer le fond ambiant vers le thème du chapitre courant
  root.style.setProperty('--a', STORY[i].a);
  root.style.setProperty('--b', STORY[i].b);
  progress.style.width=(i/(slides.length-1))*100+'%';
  prevBtn.disabled=i===0;
  nextBtn.disabled=i===slides.length-1;
  hint.style.opacity=i===0?'1':'0';
  // change la musique d'ambiance vers ce chapitre (si le son est activé)
  if(typeof playTrack==='function') playTrack(i);
}

/* Détecte le chapitre visible (sans dépendance externe) */
const io=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting && e.intersectionRatio>=0.55) setActive(slides.indexOf(e.target));
  });
},{root:track,threshold:[0.55]});
slides.forEach(s=>io.observe(s));

/* Contrôles */
prevBtn.addEventListener('click',()=>goTo(current-1));
nextBtn.addEventListener('click',()=>goTo(current+1));
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();goTo(current+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();goTo(current-1);}
  else if(e.key==='Home'){e.preventDefault();goTo(0);}
  else if(e.key==='End'){e.preventDefault();goTo(slides.length-1);}
});
/* molette verticale -> défilement horizontal (confort desktop) */
track.addEventListener('wheel',e=>{
  if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();track.scrollLeft+=e.deltaY;}
},{passive:false});

/* ---------------------------------------------------------------------
   AUDIO — une musique d'ambiance par chapitre + barre de son.
   · Le son démarre COUPÉ (les navigateurs bloquent l'autoplay sans clic).
   · Un clic sur le bouton haut-parleur lance la musique du chapitre courant.
   · À chaque changement de chapitre, la piste change avec un fondu doux.
   · Le volume est réglable ; rien d'autre sur le site n'est impacté.
   --------------------------------------------------------------------- */
const audio=new Audio();
audio.loop=true;audio.preload='none';
const soundBtn=document.getElementById('soundBtn');
const soundLabel=document.getElementById('soundLabel');
const vol=document.getElementById('vol');
let audioOn=false;            // l'utilisateur a-t-il activé le son ?
let fadeTimer=null;

/* fondu progressif du volume vers une cible */
function fadeTo(target,ms,cb){
  clearInterval(fadeTimer);
  const start=audio.volume,steps=24;let n=0;
  fadeTimer=setInterval(()=>{
    n++;
    audio.volume=Math.max(0,Math.min(1,start+(target-start)*(n/steps)));
    if(n>=steps){clearInterval(fadeTimer);if(cb)cb();}
  },Math.max(16,ms/steps));
}

/* joue (avec fondu) la musique du chapitre i */
function playTrack(i){
  if(!audioOn) return;
  const src=STORY[i]&&STORY[i].music;
  if(!src){                               // chapitre sans musique -> silence
    soundLabel.textContent='—';
    fadeTo(0,500,()=>audio.pause());
    return;
  }
  const target=parseFloat(vol.value);
  soundLabel.textContent=STORY[i].tag;
  // déjà la bonne piste en cours de lecture : on ajuste juste le volume
  if(audio.src&&audio.src.endsWith(src)&&!audio.paused){fadeTo(target,400);return;}
  fadeTo(0,300,()=>{
    audio.src=src;audio.volume=0;
    const p=audio.play();
    if(p&&p.then)p.then(()=>fadeTo(target,700))
      .catch(()=>{soundLabel.textContent='Fichier audio manquant';});
  });
}

/* bouton activer / couper le son */
soundBtn.addEventListener('click',()=>{
  audioOn=!audioOn;
  soundBtn.classList.toggle('on',audioOn);
  soundBtn.setAttribute('aria-pressed',audioOn?'true':'false');
  soundBtn.setAttribute('aria-label',audioOn?'Couper le son':'Activer le son');
  if(audioOn){playTrack(current);}
  else{soundLabel.textContent='Son coupé';fadeTo(0,400,()=>audio.pause());}
});

/* curseur de volume */
vol.addEventListener('input',()=>{
  if(audioOn&&!audio.paused){clearInterval(fadeTimer);audio.volume=parseFloat(vol.value);}
});

setActive(0);

/* ---------------------------------------------------------------------
   ENHANCEMENT GSAP (facultatif) — ajoute un parallax 3D élégant.
   Ne s'active que si GSAP est bien chargé (import vérifié par SRI),
   sur écran avec souris, et si l'utilisateur n'a pas désactivé les
   animations. Sinon : rien ne casse, les animations CSS suffisent.
   --------------------------------------------------------------------- */
window.addEventListener('load',()=>{
  const fine=window.matchMedia('(pointer:fine)').matches;
  const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(typeof gsap==='undefined' || !fine || reduce) return;

  let raf=false, nx=0, ny=0;
  window.addEventListener('pointermove',e=>{
    nx=e.clientX/window.innerWidth-.5;
    ny=e.clientY/window.innerHeight-.5;
    if(raf) return; raf=true;
    requestAnimationFrame(()=>{
      raf=false;
      const active=slides[current]; if(!active) return;
      const frame=active.querySelector('.frame');
      const img=active.querySelector('.frame img');
      gsap.to(frame,{rotateY:nx*7,rotateX:-ny*7,transformPerspective:1000,
        transformOrigin:'center',duration:.6,ease:'power2.out'});
      if(img) gsap.to(img,{xPercent:nx*-6,yPercent:ny*-6,scale:1.08,
        duration:.6,ease:'power2.out'});
    });
  });
  window.addEventListener('pointerleave',()=>{
    const active=slides[current]; if(!active) return;
    gsap.to(active.querySelector('.frame'),{rotateY:0,rotateX:0,duration:.6,ease:'power2.out'});
    const img=active.querySelector('.frame img');
    if(img) gsap.to(img,{xPercent:0,yPercent:0,scale:1,duration:.6,ease:'power2.out'});
  });
});
</script>
</body>
</html>
