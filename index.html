<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Notre aventure — 25 ans</title>
<meta name="description" content="Un voyage de Minecraft à Homies Company, en 5 chapitres." />

<!--
=====================================================================
  SITE ANNIVERSAIRE — 25 ANS  ·  storytelling en slides horizontaux
  -------------------------------------------------------------------
  · 5 chapitres qui défilent de gauche à droite.
  · Une identité graphique par univers + fond qui évolue en douceur.
  · Bulles de texte façon BD / chat, avec apparition animée.
  · Vraies images des jeux (chargées depuis des CDN officiels) +
    éléments décoratifs qui flottent, propres à chaque thème.
  · GSAP (parallax) chargé de façon sécurisée (hash SRI) et facultative.

  ✏️  POUR TOUT MODIFIER : va dans le <script> plus bas.
      - Les URLs des images sont dans l'objet  IMG  (bloc "IMAGES").
      - Les textes/bulles sont dans  STORY  (bloc "CONTENU A EDITER").
  🖼️  Les images viennent d'URL en ligne : rien à télécharger.
      Si une URL tombe un jour, l'image se masque toute seule (pas de bug).
=====================================================================
-->

<style>
/* Fondu progressif du fond entre les thèmes (repli silencieux si non supporté) */
@property --a{syntax:'<color>';inherits:true;initial-value:#7c5cff}
@property --b{syntax:'<color>';inherits:true;initial-value:#00d4ff}

:root{
  --bg:#0a0b10;--ink:#f4f6fb;--muted:rgba(244,246,251,.62);--ring:rgba(255,255,255,.14);
  --ease:cubic-bezier(.22,.61,.36,1);
  --a:#7c5cff;--b:#00d4ff;
  transition:--a 1.1s var(--ease),--b 1.1s var(--ease);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}

/* ---- Fond ambiant global ---- */
#bgwash{position:fixed;inset:0;z-index:-3;
  background:
    radial-gradient(120% 90% at 12% 8%, color-mix(in srgb,var(--a) 40%,transparent), transparent 58%),
    radial-gradient(120% 90% at 88% 100%, color-mix(in srgb,var(--b) 36%,transparent), transparent 58%),
    var(--bg)}
#bggrid{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:54px 54px;
  mask-image:radial-gradient(130% 120% at 50% 40%,#000 32%,transparent 80%)}

/* ---------------- Piste horizontale ---------------- */
#track{height:100vh;height:100dvh;display:flex;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none}
#track::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;width:100vw;height:100%;
  scroll-snap-align:center;scroll-snap-stop:always;display:grid;place-items:center;
  padding:clamp(20px,4.5vw,80px);overflow:hidden}
.slide::before{content:"";position:absolute;inset:0;z-index:-1;
  background:radial-gradient(70% 60% at var(--hx,30%) 20%,
             color-mix(in srgb,var(--sa) 32%,transparent),transparent 62%);
  opacity:0;transition:opacity 1s var(--ease)}
.slide.active::before{opacity:1}

/* ---------------- Éléments décoratifs flottants ---------------- */
.deco{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.deco .it{position:absolute;opacity:0;transition:opacity .9s var(--ease) .25s;
  animation:floaty var(--dur,7s) var(--ease) infinite;animation-delay:var(--dly,0s);
  filter:drop-shadow(0 14px 24px rgba(0,0,0,.45))}
.slide.active .deco .it{opacity:var(--op,.9)}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--rot,0deg))}
  50%{transform:translateY(-24px) rotate(calc(var(--rot,0deg) + 6deg))}}
/* blocs Minecraft (rendus en CSS, sans image) */
.blk{border-radius:4px;border:2px solid rgba(0,0,0,.4);image-rendering:pixelated;
  box-shadow:inset 0 7px 0 rgba(255,255,255,.14),inset 0 -7px 0 rgba(0,0,0,.28)}
.blk.grass{background:linear-gradient(#6ab04c 0 32%,#7a5a3a 32% 100%)}
.blk.dirt{background:#7a5a3a}
.blk.stone{background:linear-gradient(#9a9a9a,#6f6f6f)}
/* minerais : base pierre + pépites colorées (façon bloc de minerai Minecraft) */
.blk.diamond,.blk.gold,.blk.iron,.blk.redstone,.blk.emerald,.blk.coal,.blk.lapis{
  background:
    radial-gradient(circle at 28% 30%,var(--ore) 0 11%,transparent 12%),
    radial-gradient(circle at 64% 26%,var(--ore) 0 8%,transparent 9%),
    radial-gradient(circle at 44% 60%,var(--ore) 0 12%,transparent 13%),
    radial-gradient(circle at 74% 68%,var(--ore) 0 9%,transparent 10%),
    radial-gradient(circle at 22% 76%,var(--ore) 0 8%,transparent 9%),
    linear-gradient(#9a9a9a,#6f6f6f)}
.blk.diamond{--ore:#4fe3d8}
.blk.gold{--ore:#f4c43b}
.blk.iron{--ore:#e6c9b3}
.blk.redstone{--ore:#e23b3b}
.blk.emerald{--ore:#2ec96a}
.blk.coal{--ore:#242424}
.blk.lapis{--ore:#2f5bd0}
/* icônes / vignettes flottantes (images) */
.ic{object-fit:cover;border:1px solid var(--ring);background:#0d0f16;
  border-radius:16px;box-shadow:0 16px 34px -14px rgba(0,0,0,.75)}
.ic.round{border-radius:50%}
/* haltère (SVG) */
.it svg{display:block;width:100%;height:100%}
.it.db{color:#ff8a3a}

/* ---------------- Mise en page d'un chapitre ---------------- */
.inner{position:relative;z-index:1;width:min(1120px,100%);
  display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(24px,4vw,64px);align-items:center}
.slide.flip .inner{direction:rtl}
.slide.flip .inner>*{direction:ltr}

/* ---- Cadre visuel ---- */
.visual{position:relative}
.frame{position:relative;width:100%;aspect-ratio:4/5;border-radius:22px;overflow:hidden;
  border:1px solid var(--ring);
  background:linear-gradient(160deg,color-mix(in srgb,var(--sa) 26%,transparent),
             color-mix(in srgb,var(--sb) 20%,transparent)),#0e1017;
  box-shadow:0 30px 80px -30px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.06);
  transform:translateY(30px) scale(.97);opacity:0;
  transition:transform .9s var(--ease),opacity .9s var(--ease)}
.slide.active .frame{transform:none;opacity:1}
/* cadre en mode images (1 ou 2 personnages côte à côte) */
.frame.imgs{display:flex}
.frame.imgs img{flex:1 1 0;min-width:0;width:100%;height:100%;object-fit:cover;display:block}
.frame.duo img+img{border-left:1px solid rgba(255,255,255,.16)}
.frame.fit-contain{background:radial-gradient(80% 80% at 50% 40%,
  color-mix(in srgb,var(--sa) 30%,#0e1017),#0b0d13)}
.frame.fit-contain img{object-fit:contain;padding:12%}
/* cadre repère si aucune image */
.frame .ph{position:absolute;inset:0;display:grid;place-content:center;gap:.5em;text-align:center;
  color:var(--muted);padding:24px}
.frame .ph .dash{position:absolute;inset:12px;border:2px dashed var(--ring);border-radius:16px}
.frame .ph .pe{font-size:clamp(2.4rem,7vw,3.6rem)}
/* placeholder DERRIÈRE les images : visible tant que la photo n'est pas ajoutée */
.frame.imgs .ph.phback{position:absolute;inset:0;z-index:0;font-size:.9rem;line-height:1.5}
.frame.imgs img{position:relative;z-index:1}
/* scène Minecraft (bloc isométrique 3D) */
.frame.mc{display:grid;place-items:center;perspective:640px;
  background:linear-gradient(160deg,#20303a,#0d141a)}
.iso{--sz:clamp(90px,20vh,150px);width:var(--sz);height:var(--sz);position:relative;
  transform-style:preserve-3d;transform:rotateX(-24deg) rotateY(-38deg);
  animation:spin 16s linear infinite}
.iso i{position:absolute;width:var(--sz);height:var(--sz);border:2px solid rgba(0,0,0,.28)}
/* cube plein : 6 faces (dessus herbe, dessous terre, 4 côtés herbe/terre) */
.iso .top{transform:rotateX(90deg) translateZ(calc(var(--sz)/2));background:#6ab04c}
.iso .bottom{transform:rotateX(-90deg) translateZ(calc(var(--sz)/2));background:#5e442c}
.iso .side{background:linear-gradient(#7a5a3a,#5e442c);box-shadow:inset 0 9px 0 #6ab04c}
.iso .front{transform:translateZ(calc(var(--sz)/2))}
.iso .back{transform:rotateY(180deg) translateZ(calc(var(--sz)/2))}
.iso .left{transform:rotateY(-90deg) translateZ(calc(var(--sz)/2))}
.iso .right{transform:rotateY(90deg) translateZ(calc(var(--sz)/2))}
@keyframes spin{to{transform:rotateX(-24deg) rotateY(322deg)}}
/* scène salle de sport (Basic-Fit) */
.frame.gym{display:grid;place-items:center;background:linear-gradient(160deg,#13253d,#0a1420)}
.gymwrap{display:grid;gap:16px;place-items:center;animation:floaty 6s var(--ease) infinite}
.gymwrap svg{width:min(62%,220px);height:auto;color:#ff6a00;
  filter:drop-shadow(0 12px 28px rgba(255,106,0,.4))}
.gymwrap .bf{font-weight:900;letter-spacing:.06em;color:#ff6a00;
  font-size:clamp(1.1rem,3vw,1.7rem)}
.gymwrap .bf b{color:#fff}
/* carte invitation (verso de la dernière page) */
.frame.invite{display:grid;place-items:center;text-align:center;padding:clamp(18px,4vw,34px);
  background:
    radial-gradient(80% 70% at 50% 0%,color-mix(in srgb,var(--sa) 34%,transparent),transparent 70%),
    linear-gradient(160deg,#141019,#0b0a10)}
.frame.invite .iv{display:flex;flex-direction:column;align-items:center;gap:.5em;
  border:1px solid var(--ring);border-radius:18px;padding:clamp(16px,4vw,30px) clamp(14px,4vw,26px);
  background:rgba(255,255,255,.03);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.iv-k{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.iv-age{font-weight:900;line-height:1;font-size:clamp(2.6rem,9vw,4.4rem);
  background:linear-gradient(120deg,var(--sa),var(--sb));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 20px color-mix(in srgb,var(--sa) 50%,transparent))}
.iv-sub{font-size:clamp(.95rem,2.4vw,1.15rem);font-weight:600;color:var(--ink);margin-bottom:.2em}
.iv-meta{display:flex;flex-direction:column;gap:.5em;margin-top:.4em}
.ivrow{display:inline-flex;align-items:center;gap:.6em;justify-content:center;
  font-size:clamp(.9rem,2.2vw,1.05rem);font-weight:600;color:var(--ink);
  padding:.4em .9em;border:1px solid var(--ring);border-radius:999px;background:rgba(255,255,255,.04)}
.ivrow .ivi{font-size:1.05em}
.iv-foot{margin-top:.7em;font-size:.82rem;letter-spacing:.04em;color:var(--muted)}
.caption{margin-top:14px;font-size:.82rem;letter-spacing:.04em;color:var(--muted);text-align:center;
  opacity:0;transform:translateY(10px);transition:.7s var(--ease) .25s}
.slide.active .caption{opacity:1;transform:none}

/* ---- Colonne récit ---- */
.story{max-width:560px}
.chapter{display:inline-flex;align-items:center;gap:.55em;
  font-size:clamp(.66rem,1.5vw,.78rem);letter-spacing:.26em;text-transform:uppercase;color:var(--muted);
  padding:.5em 1em;border:1px solid var(--ring);border-radius:999px;background:rgba(255,255,255,.03);
  opacity:0;transform:translateY(18px);transition:.6s var(--ease)}
.chapter .dot{width:.5em;height:.5em;border-radius:50%;
  background:linear-gradient(90deg,var(--sa),var(--sb));box-shadow:0 0 12px var(--sa)}
.tag{display:block;font-weight:800;letter-spacing:.02em;margin:.7em 0 .1em;
  font-size:clamp(.9rem,2vw,1.05rem);color:color-mix(in srgb,var(--sb) 82%,var(--ink));
  opacity:0;transform:translateY(18px);transition:.6s var(--ease) .06s}
h2{font-size:clamp(1.9rem,4.6vw,3.3rem);font-weight:800;letter-spacing:-.02em;line-height:1.04;margin-bottom:.5em;
  background:linear-gradient(120deg,var(--ink),color-mix(in srgb,var(--sb) 65%,var(--ink)));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;transform:translateY(18px);transition:.7s var(--ease) .12s}
.slide.active .chapter,.slide.active .tag,.slide.active h2{opacity:1;transform:none}

/* ---- Bulles style BD / chat ---- */
.chat{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.bubble{position:relative;max-width:82%;padding:.85em 1.1em;border-radius:18px;
  font-size:clamp(.92rem,2vw,1.05rem);line-height:1.5;font-weight:500;border:1px solid var(--ring);
  box-shadow:0 12px 30px -14px rgba(0,0,0,.7);
  opacity:0;transform:scale(.8) translateY(14px);
  transition:opacity .5s var(--ease),transform .5s cubic-bezier(.34,1.56,.64,1)}
.slide.active .bubble{opacity:1;transform:none}
.slide.active .bubble:nth-child(1){transition-delay:.32s}
.slide.active .bubble:nth-child(2){transition-delay:.5s}
.slide.active .bubble:nth-child(3){transition-delay:.68s}
.slide.active .bubble:nth-child(4){transition-delay:.86s}
.bubble.a{align-self:flex-start;border-bottom-left-radius:5px;
  background:color-mix(in srgb,var(--sa) 24%,#12141c)}
.bubble.a::after{content:"";position:absolute;left:-7px;bottom:8px;width:14px;height:14px;
  background:inherit;border-left:1px solid var(--ring);border-bottom:1px solid var(--ring);
  transform:rotate(45deg);border-radius:0 0 0 4px}
.bubble.b{align-self:flex-end;border-bottom-right-radius:5px;
  background:color-mix(in srgb,var(--sb) 22%,#12141c)}
.bubble.b::after{content:"";position:absolute;right:-7px;bottom:8px;width:14px;height:14px;
  background:inherit;border-right:1px solid var(--ring);border-bottom:1px solid var(--ring);
  transform:rotate(-45deg);border-radius:0 0 4px 0}
.bubble .who{display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;
  opacity:.6;margin-bottom:.25em;font-weight:700}

/* ---------------- Navigation / habillage ---------------- */
#progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:50;
  background:linear-gradient(90deg,var(--a),var(--b));transition:width .4s var(--ease)}
#dots{position:fixed;left:50%;bottom:clamp(14px,3.5vh,30px);transform:translateX(-50%);
  display:flex;gap:11px;z-index:50;padding:9px 13px;border-radius:999px;
  background:rgba(0,0,0,.4);border:1px solid var(--ring);backdrop-filter:blur(10px)}
#dots button{width:9px;height:9px;border-radius:50%;border:0;cursor:pointer;padding:0;
  background:rgba(255,255,255,.28);transition:.3s var(--ease)}
#dots button:hover{background:rgba(255,255,255,.55)}
#dots button.on{width:26px;border-radius:999px;background:linear-gradient(90deg,var(--a),var(--b))}
.nav{position:fixed;top:50%;transform:translateY(-50%);z-index:50;width:50px;height:50px;border-radius:50%;
  cursor:pointer;display:grid;place-items:center;color:var(--ink);
  background:rgba(0,0,0,.4);border:1px solid var(--ring);backdrop-filter:blur(10px);
  transition:transform .25s var(--ease),background .25s var(--ease),opacity .3s}
.nav:hover{background:rgba(255,255,255,.12);transform:translateY(-50%) scale(1.08)}
.nav:disabled{opacity:.22;cursor:default;transform:translateY(-50%)}
#prev{left:clamp(10px,2vw,24px)}#next{right:clamp(10px,2vw,24px)}
.nav svg{width:21px;height:21px}
.hint{position:fixed;bottom:clamp(58px,11vh,96px);left:50%;transform:translateX(-50%);z-index:40;
  display:flex;align-items:center;gap:.55em;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);animation:nudge 2.2s var(--ease) infinite;transition:opacity .5s}
@keyframes nudge{0%,100%{transform:translateX(-50%)}50%{transform:translateX(calc(-50% + 9px))}}

/* ---------------- Carte retournable (flip 3D au clic) ---------------- */
.flipcard{position:relative;width:100%;aspect-ratio:4/5;perspective:1400px;cursor:pointer;
  transform:translateY(30px) scale(.97);opacity:0;
  transition:transform .9s var(--ease),opacity .9s var(--ease)}
.slide.active .flipcard{transform:none;opacity:1}
.flipcard-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .85s var(--ease)}
.flipcard.flipped .flipcard-inner{transform:rotateY(180deg)}
.flipface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flipface.back{transform:rotateY(180deg)}
/* dans une carte flip, le cadre remplit la face (on neutralise l'anim d'entrée du .frame) */
.flipcard .flipface .frame{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;
  transform:none;opacity:1}
/* petit repère "retourner" en coin */
.flip-hint{position:absolute;top:10px;right:10px;z-index:3;width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;font-size:1rem;color:var(--ink);pointer-events:none;
  background:rgba(0,0,0,.45);border:1px solid var(--ring);backdrop-filter:blur(6px);
  box-shadow:0 6px 16px -6px rgba(0,0,0,.7)}
.flipcard:hover .flip-hint{background:rgba(255,255,255,.16)}
.flipcard:focus-visible{outline:2px solid var(--sb);outline-offset:4px;border-radius:22px}

/* ---------------- Barre de son ---------------- */
#sound{position:fixed;top:clamp(10px,2vw,20px);right:clamp(10px,2vw,24px);z-index:60;
  display:flex;align-items:center;gap:10px;padding:7px 13px 7px 9px;border-radius:999px;
  background:rgba(0,0,0,.42);border:1px solid var(--ring);backdrop-filter:blur(10px);color:var(--ink)}
#soundBtn{width:32px;height:32px;flex:0 0 auto;border:0;border-radius:50%;cursor:pointer;padding:0;
  display:grid;place-items:center;color:var(--ink);background:rgba(255,255,255,.08);transition:.25s var(--ease)}
#soundBtn:hover{background:rgba(255,255,255,.18);transform:scale(1.06)}
#soundBtn svg{width:18px;height:18px}
#soundBtn .waves{display:none}#soundBtn .cross{display:block}
#soundBtn.on .waves{display:block}#soundBtn.on .cross{display:none}
#soundBtn.on{background:linear-gradient(120deg,
  color-mix(in srgb,var(--a) 55%,#12141c),color-mix(in srgb,var(--b) 55%,#12141c))}
.slabel{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  max-width:15ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vol{width:82px;height:4px;cursor:pointer;accent-color:color-mix(in srgb,var(--b) 80%,var(--ink))}

/* ---------------- Pop-up d'activation du son ---------------- */
#soundPrompt{position:fixed;inset:0;z-index:90;display:grid;place-items:center;
  padding:24px;background:rgba(2,4,10,.72);backdrop-filter:blur(10px);}
#soundPrompt.hidden{display:none}
.sound-prompt__card{width:min(92vw,420px);padding:clamp(22px,4vw,30px);border-radius:24px;
  background:linear-gradient(140deg,rgba(16,18,28,.98),rgba(8,10,18,.96));
  border:1px solid var(--ring);box-shadow:0 28px 70px -24px rgba(0,0,0,.8);text-align:center}
.sound-prompt__card h3{font-size:clamp(1.2rem,3vw,1.45rem);margin-bottom:.6rem}
.sound-prompt__card p{font-size:.95rem;line-height:1.6;color:var(--muted);margin-bottom:1.2rem}
.sound-prompt__actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.sound-prompt__actions button{border:0;border-radius:999px;padding:.8rem 1.1rem;font-weight:700;
  cursor:pointer;transition:transform .2s var(--ease),background .2s var(--ease)}
.sound-prompt__actions button:hover{transform:translateY(-1px)}
.sound-prompt__actions .primary{color:#08111d;background:linear-gradient(120deg,var(--a),var(--b))}
.sound-prompt__actions .secondary{color:var(--ink);background:rgba(255,255,255,.08)}

/* ---------------- Responsive ---------------- */
@media (max-width:860px){
  .inner{grid-template-columns:1fr;gap:22px;max-width:520px}
  .slide.flip .inner{direction:ltr}
  .frame{aspect-ratio:16/11}
  .flipcard{aspect-ratio:16/11}
  .story{max-width:none}
  .nav{display:none}
  .deco .it{transform:scale(.8)}
  #sound{gap:8px;padding:6px 10px 6px 7px}
  #vol{width:64px}
  .slabel{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;scroll-behavior:auto!important;transition:none!important}
  .chapter,.tag,h2,.frame,.caption,.bubble,.deco .it{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div id="bgwash"></div>
<div id="bggrid"></div>
<div id="progress"></div>
<main id="track" aria-label="Notre histoire en chapitres"></main>

<button id="prev" class="nav" aria-label="Chapitre précédent">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
</button>
<button id="next" class="nav" aria-label="Chapitre suivant">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
</button>
<div class="hint" id="hint">Fais défiler
  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
</div>
<nav id="dots" aria-label="Aller à un chapitre"></nav>

<div id="soundPrompt" role="dialog" aria-modal="true" aria-labelledby="soundPromptTitle">
  <div class="sound-prompt__card">
    <h3 id="soundPromptTitle">Activer le son</h3>

/* --- rendu d'un cadre (une face) --- */
function frameCore(f){
  f=f||{};
  if(f.type==='mc')
    return `<div class="frame mc"><div class="iso">
        <i class="top"></i><i class="bottom"></i>
        <i class="front side"></i><i class="back side"></i>
        <i class="left side"></i><i class="right side"></i>
      </div></div>`;
  if(f.type==='gym')
    return `<div class="frame gym"><div class="gymwrap">${DUMBBELL}<span class="bf"><b>BASIC</b>-FIT</span></div></div>`;
  if(f.type==='invite'){
    const d=f.data||{};
    const meta=[
      d.date?`<span class="ivrow"><span class="ivi">📅</span>${esc(d.date)}</span>`:'',
      d.time?`<span class="ivrow"><span class="ivi">🕛</span>${esc(d.time)}</span>`:'',
      d.place?`<span class="ivrow"><span class="ivi">📍</span>${esc(d.place)}</span>`:'',
    ].join('');
    return `<div class="frame invite"><div class="iv">
        <span class="iv-k">${esc(d.kicker||'Invitation')}</span>
        <span class="iv-age">${esc(d.age||'')}</span>
        <span class="iv-sub">${esc(d.sub||'')}</span>
        <div class="iv-meta">${meta}</div>
        ${d.foot?`<span class="iv-foot">${esc(d.foot)}</span>`:''}
      </div></div>`;
  }
  // type images
  const fit=f.fit||'cover';
  const src=(f.src||[]).filter(Boolean);
  if(!src.length)
    return `<div class="frame"><div class="ph"><span class="dash"></span><span class="pe">📷</span>Zone image</div></div>`;
  const imgs=src.map(u=>`<img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer"
      onerror="this.style.display='none'">`).join('');
  // repère "ajoute ta photo" affiché derrière : visible tant que l'image manque
  const ph=f.phNote
    ? `<div class="ph phback"><span class="dash"></span><span class="pe">📷</span>${esc(f.phNote)}</div>`
    : '';
  return `<div class="frame imgs ${src.length>1?'duo':''} fit-${fit}">${ph}${imgs}</div>`;
}

/* --- rendu du cadre : simple, ou carte retournable si un verso est défini ---
   Verso possible :
     - back:[url…] (+ backFit/backNote)   -> image(s) au dos
     - backType:'invite' (+ backData:{…}) -> carte spéciale (ex. invitation) */
function frameHTML(f){
  f=f||{};
  const front=frameCore(f);
  let backFrame=null;
  if(f.backType)
    backFrame=frameCore({type:f.backType, data:f.backData||{}});
  else{
    const back=(f.back||[]).filter(Boolean);
    if(back.length)
      backFrame=frameCore({type:'images', fit:f.backFit||'cover', src:back, phNote:f.backNote});
  }
  if(!backFrame) return front;
  return `<div class="flipcard" tabindex="0" role="button" aria-pressed="false"
      aria-label="Retourner la carte">
      <div class="flipcard-inner">
        <div class="flipface front">${front}</div>
        <div class="flipface back">${backFrame}</div>
      </div>
      <span class="flip-hint" aria-hidden="true" title="Cliquer pour retourner">⟲</span>
    </div>`;
}

/* --- rendu de la couche décorative --- */
function decoHTML(list){
  if(!list||!list.length) return '';
  const items=list.map(d=>{
    const base=`left:${d.x}%;top:${d.y}%;width:${d.s}px;`
      +`--dur:${d.r||7}s;--dly:${d.d||0}s;--rot:${d.rot||0}deg;--op:${d.op??.9};`;
    if(d.t==='blk') return `<span class="it blk ${d.v}" style="${base}height:${d.s}px"></span>`;
    if(d.t==='db')  return `<span class="it db" style="${base}height:${d.s}px">${DUMBBELL}</span>`;
    if(d.t==='img') return `<img class="it ic ${d.round?'round':''}" src="${esc(d.src)}" alt=""
        loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()"
        style="${base}height:${d.round?d.s+'px':'auto'}">`;
    return '';
  }).join('');
  return `<div class="deco" aria-hidden="true">${items}</div>`;
}

const slides=[...document.querySelectorAll('.slide')];
const dots=[...dotsWrap.children];
let current=-1;

function goTo(i){
  i=Math.max(0,Math.min(slides.length-1,i));
  slides[i].scrollIntoView({behavior:'smooth',inline:'start'});
}
function setActive(i){
  if(i===current) return;
  current=i;
  slides.forEach((s,k)=>s.classList.toggle('active',k===i));
  dots.forEach((d,k)=>d.classList.toggle('on',k===i));
  root.style.setProperty('--a', STORY[i].a);
  root.style.setProperty('--b', STORY[i].b);
  progress.style.width=(i/(slides.length-1))*100+'%';
  prevBtn.disabled=i===0;
  nextBtn.disabled=i===slides.length-1;
  hint.style.opacity=i===0?'1':'0';
  if(typeof playTrack==='function') playTrack(i);   // musique du chapitre (si son activé)
}

const io=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting && e.intersectionRatio>=0.55) setActive(slides.indexOf(e.target));
  });
},{root:track,threshold:[0.55]});
slides.forEach(s=>io.observe(s));

prevBtn.addEventListener('click',()=>goTo(current-1));
nextBtn.addEventListener('click',()=>goTo(current+1));

/* --- Carte retournable : clic ou Entrée/Espace retourne l'image --- */
function toggleFlip(card){
  const flipped=card.classList.toggle('flipped');
  card.setAttribute('aria-pressed',flipped?'true':'false');
}
track.addEventListener('click',e=>{
  const card=e.target.closest('.flipcard');
  if(card) toggleFlip(card);
});
track.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('flipcard')){
    e.preventDefault();toggleFlip(e.target);
  }
});
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();goTo(current+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();goTo(current-1);}
  else if(e.key==='Home'){e.preventDefault();goTo(0);}
  else if(e.key==='End'){e.preventDefault();goTo(slides.length-1);}
});
track.addEventListener('wheel',e=>{
  if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();track.scrollLeft+=e.deltaY;}
},{passive:false});

let audioOn=false;
let fadeTimer=null;

function hideSoundPrompt(){
  if(soundPrompt) soundPrompt.classList.add('hidden');
}
function enableSound(){
  audioOn=true;
  soundBtn.classList.add('on');
  soundBtn.setAttribute('aria-pressed','true');
  soundBtn.setAttribute('aria-label','Couper le son');
  hideSoundPrompt();
  playTrack(current);
}

function fadeTo(target,ms,cb){
  clearInterval(fadeTimer);
  const start=audio.volume,steps=24;let n=0;
  fadeTimer=setInterval(()=>{
    n++;audio.volume=Math.max(0,Math.min(1,start+(target-start)*(n/steps)));
    if(n>=steps){clearInterval(fadeTimer);if(cb)cb();}
  },Math.max(16,ms/steps));
}
function playTrack(i){
  if(!audioOn) return;
  const src=STORY[i]&&STORY[i].music;
  if(!src){soundLabel.textContent='—';fadeTo(0,500,()=>audio.pause());return;}
  const target=parseFloat(vol.value);
  soundLabel.textContent=STORY[i].tag;
  if(audio.src&&audio.src.endsWith(src)&&!audio.paused){fadeTo(target,400);return;}
  fadeTo(0,300,()=>{
    audio.src=src;audio.volume=0;
    const p=audio.play();
    if(p&&p.then)p.then(()=>fadeTo(target,700))
      .catch(()=>{soundLabel.textContent='Fichier audio manquant';});
  });
}
soundBtn.addEventListener('click',()=>{
  audioOn=!audioOn;
  soundBtn.classList.toggle('on',audioOn);
  soundBtn.setAttribute('aria-pressed',audioOn?'true':'false');
  soundBtn.setAttribute('aria-label',audioOn?'Couper le son':'Activer le son');
  if(audioOn){playTrack(current);}
  else{soundLabel.textContent='Son coupé';fadeTo(0,400,()=>audio.pause());}
});
soundPromptEnable.addEventListener('click',enableSound);
soundPromptLater.addEventListener('click',hideSoundPrompt);
vol.addEventListener('input',()=>{
  if(audioOn&&!audio.paused){clearInterval(fadeTimer);audio.volume=parseFloat(vol.value);}
});

setActive(0);

window.addEventListener('load',()=>{
  const fine=window.matchMedia('(pointer:fine)').matches;
  const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(typeof gsap==='undefined' || !fine || reduce) return;
  let raf=false,nx=0,ny=0;
  window.addEventListener('pointermove',e=>{
    nx=e.clientX/window.innerWidth-.5; ny=e.clientY/window.innerHeight-.5;
    if(raf) return; raf=true;
    requestAnimationFrame(()=>{
      raf=false;
      const a=slides[current]; if(!a) return;
      gsap.to(a.querySelector('.frame'),{rotateY:nx*7,rotateX:-ny*7,
        transformPerspective:1000,transformOrigin:'center',duration:.6,ease:'power2.out'});
      const imgs=a.querySelectorAll('.frame.imgs img');
      if(imgs.length) gsap.to(imgs,{xPercent:nx*-5,yPercent:ny*-5,scale:1.07,duration:.6,ease:'power2.out'});
    });
  });
  window.addEventListener('pointerleave',()=>{
    const a=slides[current]; if(!a) return;
    gsap.to(a.querySelector('.frame'),{rotateY:0,rotateX:0,duration:.6,ease:'power2.out'});
    const imgs=a.querySelectorAll('.frame.imgs img');
    if(imgs.length) gsap.to(imgs,{xPercent:0,yPercent:0,scale:1,duration:.6,ease:'power2.out'});
  });
});
</script>
</body>
